name: Plan check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Plan integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrity check
        run: |
          chmod +x tools/validate.sh
          ./tools/validate.sh

  links:
    name: External links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: External link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-all-private
            --accept 200,206,429
            '**/*.md'
          fail: false
